name: Apply report update

on:
  push:
    paths:
      - 'scripts/apply_report_polish.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply report polish
        run: python scripts/apply_report_polish.py

      - name: Commit report update
        run: |
          if git diff --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git config user.name "hyrox-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Mentionlytics and GA4 report sections"
          git push
